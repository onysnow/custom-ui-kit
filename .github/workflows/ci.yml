name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Packages type-check against each other's built declarations, so build them first (in dependency order).
      - run: bun run build:packages
      - run: bun run lint
      - run: bun run check:layers
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
